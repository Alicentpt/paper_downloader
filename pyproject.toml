[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paper_downloader"
version = "0.1.0"
description = "CLI and Python helpers for downloading papers from arXiv and Sci-Hub."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyPDF2",
  "arxiv",
  "beautifulsoup4",
  "pdfminer.six",
  "requests",
  "retrying",
  "urllib3",
]

[project.scripts]
paper-downloader = "paper_downloader.main:main"
paper-downloader-mcp = "paper_downloader.mcp_server:main"

[project.optional-dependencies]
mcp = ["mcp>=1.12,<2"]
dev = ["pytest==9.0.2", "ruff==0.15.4", "pyright==1.1.408"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["paper_downloader/mcp_server.py", "paper_downloader/mcp_downloads.py", "paper_downloader/clients", "paper_downloader/scrappers/arxiv.py", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["paper_downloader*"]
